<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin Oracle{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 bg-dark text-white min-vh-100 p-3">
      <h5 class="mb-4">Admin Oracle 21c XE</h5>
      <ul class="nav flex-column">
        {% for endpoint, nombre in modulos %}
        <li class="nav-item"><a class="nav-link text-white" href="{{ url_for(endpoint) }}">{{ nombre }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <main class="col-md-10 p-4">
      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in mensajes %}<div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
